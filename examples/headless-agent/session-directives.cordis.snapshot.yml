# Keyless real-Loader composition for a resumed session with a durable directive.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: session-directives
  name: '@deepseek-ai/dsh-session-directives'
  config:
    maxEntries: 12
    maxTokens: 256
    valueMaxChars: 200

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/session-directives-agent.ts'
